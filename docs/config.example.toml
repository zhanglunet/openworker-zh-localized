# coworker config — copy to one of:
#   ~/.config/coworker/config.toml          (global)
#   <your-project>/.coworker/config.toml    (per-workspace, overrides global)
#
# All keys are optional; unset keys fall back to built-in defaults.

model = "gpt-5.5"            # default model id (override per session in the UI/CLI)
mode = "interactive"         # plan | interactive | auto | custom
max_iterations = 12          # max model<->tool iterations per turn before stopping

# Commands auto-allowed without an approval prompt (prefix match).
allowed_commands = [
  "ls", "cat", "pwd", "grep", "find",
  "git status", "git diff", "git log",
  "python3", "pytest", "node", "npm",
]

# In "custom" permission mode, these tools are auto-approved (everything else still
# asks). e.g. auto-accept file edits but keep asking before running shell commands.
auto_allow = ["write_file", "replace_in_file", "apply_patch", "apply_unified_diff"]

# Folders mounted READ-ONLY into every knowledge-work session, on top of its scratch dir.
# This is how a shared reference corpus (runbooks, policies, a synced knowledge drive) is
# available in every conversation without re-adding it each time. Global config only: it
# grants read access, so a checked-out repo must never be able to declare one. Missing
# paths are skipped silently.
# knowledge_roots = ["~/CorpKB", "/Volumes/Shared/policies"]

# Catalog policy — which connectors / model providers this installation may use.
# Empty allowlist = no restriction. A name in both lists is denied (deny wins). Enforced at
# every path, not just the listing: a denied connector's tools are never assembled, connect
# is refused, and building a denied provider's client raises. Global config only.
# allowed_connectors = ["github", "jira"]
# denied_connectors  = ["gmail", "slack"]
# allowed_providers  = ["custom", "ollama"]
# denied_providers   = ["openai", "anthropic"]

# Ship audit events to an enterprise log sink (SIEM). Empty url = off. Forwarding runs on a
# background thread with a bounded queue and fails open: the local audit log stays the
# source of truth, and an unreachable collector never blocks or breaks a turn.
# audit_forward_url     = "https://siem.corp.internal/ingest"
# audit_forward_token   = "${CORP_SIEM_TOKEN}"   # sent as Bearer; ${VAR} reads the env
# audit_forward_batch   = 50
# audit_forward_timeout = 5

# Server (openworker-server) bind address.
host = "127.0.0.1"
port = 8765
