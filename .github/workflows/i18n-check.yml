# 翻译 CI 校验（PRD-084/T3）
# 触发：PR 改动 README*.md / docs/**（docs/plans/ 除外），或 PR 标题含 [i18n]；支持手动触发。
# 检查：①术语锁定——复用 scripts/quality-gate.py 的 check_terms（25 条术语同一份源头），
#       术语英文词出现但中文译法与拍板值不一致 → 失败，阻断合并；
#       ②链接检查——复用 scripts/i18n-pipeline.py 的 check_links：
#       内链（仓库内相对路径）断裂 → 失败阻断；外链（http/https）不可达 → 警告不阻断（用户决策② B）。
# 规则依据：docs/plans/2026-10-19-i18n-pipeline-design.md §5。

name: 翻译校验（i18n-check）

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  i18n-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 流水线脚本自测（证明检查逻辑本身没坏）
        run: python3 scripts/i18n-pipeline.py --self-test
      - name: 术语锁定 + 链接检查
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 - <<'PYEOF'
          import fnmatch, importlib.util, os, subprocess, sys

          def load(name, path):
              spec = importlib.util.spec_from_file_location(name, path)
              mod = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(mod)
              return mod

          # 复用已有检查函数，不复制逻辑：术语表唯一源头 = quality-gate.py 的 TERMS
          qg = load("qg", "scripts/quality-gate.py")
          i18n = load("i18n_pipeline", "scripts/i18n-pipeline.py")
          TERMS = qg.TERMS
          print("术语表：%d 条（源头 scripts/quality-gate.py）" % len(TERMS), flush=True)

          def in_scope(p):
              base = os.path.basename(p)
              if fnmatch.fnmatch(base, "README*.md"):
                  return True
              if p.startswith("docs/") and p.endswith(".md"):
                  return not p.startswith("docs/plans/")
              return False

          is_pr = bool(os.environ.get("PR_BASE_SHA"))
          title = os.environ.get("PR_TITLE", "")
          if is_pr:
              base = os.environ["PR_BASE_SHA"]
              changed = subprocess.run(
                  ["git", "diff", "--name-only", base + "...HEAD"],
                  capture_output=True, text=True, check=True,
              ).stdout.splitlines()
              if "[i18n]" not in title and not any(in_scope(p) for p in changed):
                  print("跳过：PR 未改动翻译文档且标题不含 [i18n]", flush=True)
                  sys.exit(0)
              candidates = [p for p in changed if in_scope(p)]
          else:
              # workflow_dispatch：全量扫描在库文档
              candidates = []
              for root, _, fns in os.walk("."):
                  if root.startswith(("./.git",)):
                      continue
                  for fn in fns:
                      p = os.path.relpath(os.path.join(root, fn), ".")
                      if in_scope(p):
                          candidates.append(p)

          files = {}
          for p in sorted(set(candidates)):
              if not os.path.isfile(p):
                  continue
              try:
                  with open(p, encoding="utf-8") as f:
                      files[p] = f.read()
              except (OSError, UnicodeDecodeError):
                  continue
          print("检查范围：%d 个文档" % len(files), flush=True)

          term_failures = qg.check_terms(files, TERMS)
          link_errors, link_warnings = [], []
          for p, text in files.items():
              e, w = i18n.check_links(text, p, ".")
              link_errors += [(p, x) for x in e]
              link_warnings += [(p, x) for x in w]

          for x in term_failures:
              print("术语失败：[%s] %s:%s（期望：%s）" %
                    (x["check"], x["file"], x.get("line"), x["expected"]), flush=True)
          for p, x in link_errors:
              print("内链失败：%s" % x, flush=True)
          for p, x in link_warnings:
              print("警告：%s" % x, flush=True)

          lines = ["## 翻译校验（i18n-check）结果", ""]
          blocked = term_failures + link_errors
          if blocked:
              lines.append("❌ %d 项失败（阻断合并）" % len(blocked))
              lines.append("")
              lines.append("| 类型 | 文件 | 说明 |")
              lines.append("| --- | --- | --- |")
              for x in term_failures:
                  lines.append("| 术语锁定 | %s | 行 %s：%s（期望译法：%s） |" % (
                      x["file"], x.get("line") or "-",
                      x["detail"].replace("|", "\\|").replace("\n", " "), x["expected"]))
              for p, x in link_errors:
                  lines.append("| 内链断裂 | %s | %s |" % (p, x.replace("|", "\\|")))
          else:
              lines.append("✅ 术语锁定：%d 个文档，0 失败；内链：0 断裂" % len(files))
          if link_warnings:
              lines.append("")
              lines.append("⚠️ %d 条警告（不阻断）：%s" % (
                  len(link_warnings),
                  "；".join(x for _, x in link_warnings[:5]).replace("|", "\\|")))
          lines.append("")
          lines.append("口径：术语不一致→阻断；内链断裂→阻断；外链不可达→仅警告"
                       "（PRD-084/T1 决策② B）。")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")

          n_fail = len(term_failures) + len(link_errors)
          print("翻译校验：%d 失败，%d 警告" % (n_fail, len(link_warnings)), flush=True)
          sys.exit(1 if n_fail else 0)
          PYEOF
