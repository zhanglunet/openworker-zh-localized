name: Deploy oaosf.cn

# 中文站自动部署到 Cloudflare Workers。
#
# 触发：main 分支上 website/ 或 docs/ 变化时（docs/ 会影响 generate:reports 的产物），
# 以及手动触发。update-site-reports.yml 回写 main 后也会连带触发一次，
# 保证站点内容与仓库同步。
#
# 前置：仓库 Secrets 配置 CLOUDFLARE_API_TOKEN（Workers 编辑权限）。
# 未配置时本工作流不会失败，只跳过部署并提示——避免误报红灯。
# 可选 Secrets：CLOUDFLARE_ACCOUNT_ID（当 token 可访问多个账号时必填）。
#
# 域名绑定（oaosf.cn → Worker）不在本仓库配置中，需在 Cloudflare 控制台
# Workers & Pages → openworker-cn-site → Settings → Domains & Routes 手工绑定一次。

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # generate:reports 需要完整 git 历史统计提交

      - name: Check deploy credentials
        id: creds
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 CLOUDFLARE_API_TOKEN，跳过部署。在仓库 Settings → Secrets 添加后即可自动发布。"
          fi

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ready == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        if: steps.creds.outputs.ready == 'true'
        working-directory: website
        run: npm ci

      - name: Build and test
        if: steps.creds.outputs.ready == 'true'
        working-directory: website
        run: npm test # 先构建（含 generate:reports）再跑渲染断言，失败即不发布
        env:
          REPORT_GENERATED_AT: ${{ github.event.head_commit.timestamp }}

      - name: Deploy to Cloudflare Workers
        if: steps.creds.outputs.ready == 'true'
        working-directory: website
        run: npx wrangler deploy --config wrangler.jsonc
